[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-cli"
dynamic = ["version"]
description = "OMNI Link CLI - 复用 OMNI Link 后端接口的命令行客户端（探针/烧录/RTT/设备库/Commander）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
omni = "omnilink_cli.cli:main"

[tool.setuptools]
packages = ["omnilink_cli", "omnilink_cli.commands"]
package-dir = { "omnilink_cli" = ".", "omnilink_cli.commands" = "commands" }

[tool.setuptools.dynamic]
version = { attr = "omnilink_cli.__version__" }