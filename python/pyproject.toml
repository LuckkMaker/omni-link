# 本文件仅用于把内置的 pyOCD fork（python/pyocd/）打成 omni-pyocd 发行版，
# 不包含 OMNI Link 后端（api/、core/、server.py、data/、flm/ 等）。
#
# 后端走的是另一条链路：python/build.py → omni-backend.spec（PyInstaller），
# 开发与常规构建都不需要执行 pip install，pyocd 以源码形式经 sys.path 直接 import。
# 详见 docs/tech/architecture.md（"pyOCD 源码内置 python/pyocd/，不通过 pip 安装"）。
#
# 注意：本文件保持在 python/ 根而非移入 python/pyocd/。pyocd 是 28 个包目录的多层包
# 且带 package data（svd_data.zip 等），"项目根=包目录"需要逐包映射 package-dir 并重写
# package-data 路径，且 packages.find 无法为包名加 pyocd. 前缀，故不适合该写法。

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-pyocd"
version = "0.1.0"
description = "OMNI-Link fork of pyOCD (pyocd) with extra builtin Geehy targets"
requires-python = ">=3.8"
dependencies = [
    "colorama>=0.4.6",
    "hidapi>=0.15.0",
    "importlib_metadata>=9.0.0",
    "importlib_resources>=7.1.0",
    "intelhex>=2.3.0",
    "intervaltree>=3.2.1",
    "lark>=1.3.0",
    "libusb-package>=1.0.30",
    "natsort>=8.4.0",
    "prettytable>=3.18.0",
    "pyelftools>=0.31.0",
    "pylink-square>=1.7.0",
    "pyusb>=1.3.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.16.0",
    "capstone>=5.0.0",
    "cmsis-pack-manager>=0.6.0",
]

[project.scripts]
pyocd = "pyocd.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyocd*"]

[tool.setuptools.package-data]
pyocd = [
    "debug/svd/svd_data.zip",
    "debug/sequences/*.lark",
    "debug/sequences/*.yaml",
    "LICENSE",
]