[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-pyocd"
version = "0.44.1"
description = "OMNI-Link fork of pyOCD (pyocd) with extra builtin Geehy targets"
requires-python = ">=3.8"
dependencies = [
    "colorama>=0.4.6",
    "hidapi>=0.15.0",
    "importlib_metadata>=9.0.0",
    "importlib_resources>=7.1.0",
    "intelhex>=2.3.0",
    "intervaltree>=3.2.1",
    "lark>=1.3.0",
    "libusb-package>=1.0.30",
    "natsort>=8.4.0",
    "prettytable>=3.18.0",
    "pyelftools>=0.31.0",
    "pylink-square>=1.7.0",
    "pyusb>=1.3.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.16.0",
    "capstone>=5.0.0",
    "cmsis-pack-manager>=0.6.0",
]

[project.scripts]
pyocd = "pyocd.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyocd*"]

[tool.setuptools.package-data]
pyocd = [
    "debug/svd/svd_data.zip",
    "debug/sequences/default_sequences.yaml",
    "LICENSE",
]