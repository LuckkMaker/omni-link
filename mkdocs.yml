site_name: OMNI Link
site_description: 一站式嵌入式调试工作台
site_author: LuckkMaker

theme:
  name: material
  language: zh
  favicon: assets/images/icon_rounded.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - css/extra.css

extra_javascript:
  - js/extra.js

repo_name: omni-link
repo_url: https://github.com/LuckkMaker/omni-link

copyright: © 2026 LuckkMaker · OMNI Link · Made for embedded developers

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      pygments_style: "github-dark"
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html

nav:
  - 主页: index.md
  - 功能介绍: features.md

exclude_docs: |
  getting-started.md
  contributing.md
  guide/
  reference/
  rule/
  tech/